[package]
name = "shared-audio"
version = "0.1.0"
edition = "2021"
description = "Schlanker Windows-Audio-Splitter: Loopback einer Quelle auf mehrere Ausgabegeräte"
license = "MIT"

[lib]
name = "shared_audio"
path = "src/lib.rs"

[[bin]]
name = "shared-audio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
rubato = "5"
ringbuf = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
ctrlc = "3"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
